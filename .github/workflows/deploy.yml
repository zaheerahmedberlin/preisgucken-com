name: Deploy preisgucken.com

on:
  push:
    branches: [main]
  workflow_dispatch:       # allow a manual re-run from the GitHub UI

# A second push landing mid-deploy used to be able to race the first —
# queue instead of running concurrently, same pattern as nextjs-app's
# sync_awin.yml.
concurrency:
  group: deploy-com
  cancel-in-progress: false

# Runs via SSH against the netcup box's own scripts/deploy.sh dispatcher
# (that script lives in the nextjs-app repo, but the forced-command path
# is fixed on the server and handles both sites) — the SSH key can only
# ever run "deploy-de" or "deploy-com", nothing else. The dispatcher does
# git fetch + reset --hard + npm ci + build + restart on the server
# itself, and aborts before touching the running service if any step
# fails.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to netcup
        env:
          SSH_KEY: ${{ secrets.NETCUP_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          echo "$SSH_KEY" > key.pem && chmod 600 key.pem
          # ServerAlive* keeps the SSH connection alive during npm run build,
          # which produces little/no output for several minutes — without
          # this, something in the network path treats the session as idle
          # and drops it ("client_loop: send disconnect: Broken pipe"),
          # aborting the deploy mid-build. Confirmed live 2026-09-14 on the
          # sibling nextjs-app deploy (same server, same script family) —
          # applying the same fix here before it hits this site too.
          ssh -i key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 deploy@$HOST "deploy-com"
